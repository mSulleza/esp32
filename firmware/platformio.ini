; PlatformIO project — ESP32 Smart AC Controller
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; OTA: dual app slots. min_spiffs gives two ~1.9MB OTA partitions on the 4MB N4
; (+ a small 190KB FS) — the ~1.16MB app fits each slot at ~61% with headroom.
; (Default dual-OTA caps each slot at 1.31MB = too tight; huge_app has no 2nd slot.)
board_build.partitions = min_spiffs.csv

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MQTT_MAX_PACKET_SIZE=2048    ; AC frames + schedule lists can be large

lib_deps =
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    adafruit/Adafruit SHT4x Library @ ^1.0.5
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8

; PubSubClient's default buffer is too small for our payloads; MQTT_MAX_PACKET_SIZE
; above plus setBufferSize() in cloud.cpp handles it.
